      - liq_video_frames_pool
      - liq_video_frames_pool_small
      - liq_video_frames_pool_default
      - liq_video_frames_pool_large
      macro-owl:
      - owl_gc
      - owl_gc_small
      - owl_gc_default
      - owl_gc_large
      macro-pplacer:
      - pplacer_testsuite
      - pplacer_like_small
      - pplacer_like_default
      - pplacer_like_large
      macro-zarith:
      - zarith_pi
      - zarith_pi_small
      - zarith_pi_default
      - zarith_pi_large
      - zarith_pi_huge
    verified_at:
    - "duniverse/Zarith/caml_z.c \u2014 caml_alloc_custom + ml_z_custom_ops for every\
      \ bignum result"
    - "duniverse/camlzip/zlibstubs.c:61,67 \u2014 camlzip_stream_ops, caml_alloc_custom\
      \ over z_streamp (devkit_gzip)"
    - "duniverse/sqlite3-ocaml/lib/sqlite3_stubs.c:398,533,859 \u2014 db_wrap_ops\
      \ / stmt_wrap_ops, caml_alloc_custom_mem (infer's capture DB)"
    - "benchmarks/liq-video-frames/pool_stubs.c:34 \u2014 caml_alloc_custom_mem with\
      \ mem = plane size, allocating no buffer"
    - "duniverse/Zarith/z.ml:39-49 \u2014 add/sub/neg test is_small_int first, which\
      \ is why the analysers are cold here"
    - "runtime/bigarray.c:202,281 \u2014 caml_ba_finalize is the finalize op of caml_ba_ops,\
      \ so every owl / pplacer / decompress / liq-video-frames array carries one (5.5.0)"
    - "ocaml#14571 \u2014 owl_gc_default regressed +31% purely because the order those\
      \ finalisers freed in moved glibc past its mmap/trim threshold"
  default_run:
    description: "Input-size ladder \u2014 the DEFAULT rung of every tool. This is\
      \ the tag a bare run\n(no RUNNING_TAG) falls back to, so `default_run` is the\
