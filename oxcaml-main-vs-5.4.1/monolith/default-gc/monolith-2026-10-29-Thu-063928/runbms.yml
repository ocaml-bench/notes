      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
      macro-merlin:
      - merlin_bench
    description: "Domain.spawn / Domain.join, Domain.cpu_relax and Domain.DLS \u2014\
      \ the\nonly multi-domain workload in the suite now that lavyek is disabled,\n\
      so it is also the only exercise of the parallel minor GC and of\ncross-domain\
      \ major-GC participation. Infer's DomainPool spawns one\nanalysis worker per\
      \ CPU of the inherited mask (we patch that pinning\nin; without it the kernel\
      \ migrates workers and the wall time stops\nbeing reproducible, 87.9s unpinned\
      \ against 26.3s pinned on an\nisolcpus host), and its per-procedure analysis\
      \ driver reads\ndomain-local state on every call.\nNot covered here: contended\
      \ Atomic.* traffic. Both eio and infer do\nuse Atomic, but at a rate no profile\
      \ can see, so there is no tag for\nit \u2014 that was lavyek's job.\n"
    exercised_by:
      macro-infer-monorepo:
      - infer_small
      - infer_default
      - infer_large
    verified_at:
    - "infer DomainPool.ml:134,98,238 \u2014 Domain.spawn, Domain.join, Domain.cpu_relax\
      \ (vendor/infer, cloned by scripts/vendor-infer.sh)"
    - "infer backend/ondemand.ml:56-90 \u2014 DLS.new_key / DLS.get per analysed procedure"
    - "benchmarks/infer/infer.build.sh \u2014 the wrapper runs `infer analyze --multicore\
      \ --jobs $(nproc)`"
    - "macro-benches scripts/vendor-infer.sh:121-160 \u2014 patches DomainPool.child\
      \ to call Processor.Affinity.set_ids per worker"
    - 'perf 5.5.0: no caml_atomic_* or Atomic symbol appears in any eio or infer profile;
      native atomics are inlined and uncontended here'
