benchmarks:
  macro-alt-ergo-monorepo:
  - alt_ergo_chain_default
  - alt_ergo_chain_large
  macro-coq-monorepo:
  - coqc_tree_default
  - coqc_tree_large
  macro-cpdf-monorepo:
  - cpdf_squeeze_default
  - bm_name: cpdf_squeeze_large
    name: cpdf_squeeze_large
    timeout: 900
  macro-decompress:
  - test_decompress_default
  - bm_name: test_decompress_large
    name: test_decompress_large
    timeout: 1200
  macro-devkit:
  - devkit_htmlstream_default
  - devkit_htmlstream_large
  macro-eio:
  - eio_conc_default
  - bm_name: eio_conc_large
    name: eio_conc_large
    timeout: 600
  macro-frama-c-monorepo:
  - frama_c_eva_sqlite_default
  - bm_name: frama_c_eva_sqlite_large
    name: frama_c_eva_sqlite_large
    timeout: 2400
  macro-goblint-monorepo:
  - goblint_gen_default
  - bm_name: goblint_gen_large
    name: goblint_gen_large
    timeout: 900
  macro-infer-monorepo:
  - infer_default
  - infer_large
  macro-irmin:
  - irmin_mem_rw_default
  - bm_name: irmin_mem_rw_large
    name: irmin_mem_rw_large
    timeout: 900
  macro-jsoo:
  - jsoo_default
  - jsoo_large
  macro-lavyek-monorepo: []
  macro-liq-video-frames:
  - liq_video_frames_pool_default
  - bm_name: liq_video_frames_pool_large
    name: liq_video_frames_pool_large
    timeout: 1200
  macro-liquidsoap-lang:
  - liq_parse_typecheck_default
  - bm_name: liq_parse_typecheck_large
    name: liq_parse_typecheck_large
    timeout: 1200
  macro-menhir-monorepo:
  - menhir_ocamly
  - bm_name: menhir_sysver_canonical
    name: menhir_sysver_canonical
    timeout: 1200
  macro-merlin: []
  macro-ocamlc-self-compile:
  - ocamlc_compile_uucp_default
  - bm_name: ocamlc_compile_uucp_large
    name: ocamlc_compile_uucp_large
    timeout: 1800
  macro-ocamlformat:
  - ocamlformat_rocq_default
  - bm_name: ocamlformat_rocq_large
    name: ocamlformat_rocq_large
    timeout: 1200
  macro-owl:
  - owl_gc_default
  - bm_name: owl_gc_large
    name: owl_gc_large
    timeout: 7200
  macro-pplacer:
  - pplacer_like_default
  - bm_name: pplacer_like_large
    name: pplacer_like_large
    timeout: 1200
  macro-sedlex:
  - sedlex_tokenize_default
  - bm_name: sedlex_tokenize_large
    name: sedlex_tokenize_large
    timeout: 900
  macro-yojson:
  - ydump_repeat_default
  - ydump_repeat_large
  macro-zarith:
  - zarith_pi_default
  - zarith_pi_large
comparisons:
- a: ocaml-5.4.1
  b:
  - oxcaml-main
  label: OxCaml main vs 5.4.1
- a: ocaml-5.4.1-flambda
  b:
  - oxcaml-main
  label: OxCaml main vs 5.4.1 flambda
compress_logs: false
configs:
- ocaml-5.4.1|perf_grp1
- ocaml-5.4.1-flambda|perf_grp1
- oxcaml-main|perf_grp1
default_modifiers:
- pin_bench
- pin_bench_mc
invocations: 5
modifiers:
  gc_verbose:
    type: OCamlRunParam
    val: v=0x400
  md:
    excludes: &id002
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    type: OCamlRunParam
    val: d={0}
  md_par:
    excludes: &id001
      macro-alt-ergo-monorepo:
      - alt_ergo_fill
      - alt_ergo_yyll
      - alt_ergo_unsat_smt2
      macro-coq-monorepo:
      - coqc_corelib_stress
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      macro-decompress:
      - test_decompress
      macro-devkit:
      - devkit_htmlstream
      - devkit_stre
      - devkit_network
      - devkit_gzip
      macro-eio:
      - eio_fiber_stream
      macro-irmin:
      - irmin_mem_rw
      macro-jsoo:
      - jsoo
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-liquidsoap-lang:
      - liq_parse_typecheck
      macro-menhir-monorepo:
      - menhir_ocamly
      - menhir_sql_parser
      - menhir_sysver
      macro-merlin:
      - merlin_bench
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      macro-ocamlformat:
      - ocamlformat_rocq
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-sedlex:
      - sedlex_tokenize
      macro-yojson:
      - ydump_repeat
      macro-zarith:
      - zarith_pi
    type: OCamlRunParam
    val: d={0}
  memtrace_grp1:
    excludes:
      macro-alt-ergo-monorepo:
      - alt_ergo_fill
      - alt_ergo_yyll
      - alt_ergo_unsat_smt2
      macro-coq-monorepo:
      - coqc_corelib_stress
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      macro-devkit:
      - devkit_htmlstream
      - devkit_stre
      - devkit_network
      - devkit_gzip
      macro-eio:
      - eio_fiber_stream
      macro-frama-c-monorepo:
      - frama_c_eva_t
      - frama_c_eva_sqlite
      macro-goblint-monorepo:
      - goblint
      macro-infer-monorepo:
      - infer_small
      - infer_default
      - infer_large
      macro-irmin:
      - irmin_mem_rw
      macro-jsoo:
      - jsoo
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-liquidsoap-lang:
      - liq_parse_typecheck
      macro-menhir-monorepo:
      - menhir_ocamly
      - menhir_sql_parser
      - menhir_sysver
      macro-merlin:
      - merlin_bench
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      macro-ocamlformat:
      - ocamlformat_rocq
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-sedlex:
      - sedlex_tokenize
      macro-yojson:
      - ydump_repeat
      macro-zarith:
      - zarith_pi
    type: MemtraceAttach
  perf_grp1:
    type: PerfAndOllyAttach
    val: task-clock,page-faults,cycles,instructions
    val_freebsd: instructions,unhalted-cycles,PAGE_FAULT.ALL
  perf_grp1_freebsd:
    type: PerfAndOllyAttach
    val: instructions,unhalted-cycles,PAGE_FAULT.ALL
  perf_grp2:
    type: PerfAndOllyAttach
    val: task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend
    val_freebsd: instructions,unhalted-cycles,idq_uops_not_delivered.core,resource_stalls.any
  perf_grp2_freebsd:
    type: PerfAndOllyAttach
    val: instructions,unhalted-cycles,idq_uops_not_delivered.core,resource_stalls.any
  perf_grp3:
    type: PerfAndOllyAttach
    val: task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses
    val_freebsd: instructions,unhalted-cycles,longest_lat_cache.miss,mem_load_uops_retired.l3_miss,dtlb_load_misses.walk_completed,itlb_misses.walk_completed
  perf_grp3_freebsd:
    type: PerfAndOllyAttach
    val: instructions,unhalted-cycles,longest_lat_cache.miss,mem_load_uops_retired.l3_miss,dtlb_load_misses.walk_completed,itlb_misses.walk_completed
  pin_bench:
    bench_cores: '1'
    excludes:
      macro-infer-monorepo:
      - infer_small
      - infer_default
      - infer_large
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    type: CpuPin
  pin_bench_mc:
    includes:
      macro-infer-monorepo:
      - infer_small
      - infer_default
      - infer_large
    type: CpuPin
  pin_lavyek:
    excludes: *id001
    one_node: true
    type: CpuPin
    val: '0'
  plan:
    type: EnvVar
    val: '{0}'
    var: MMTK_PLAN
  re:
    excludes: *id002
    type: OCamlRunParam
    val: e={0}
  re_par:
    excludes: *id001
    type: OCamlRunParam
    val: e={0}
  threads:
    type: EnvVar
    val: '{0}'
    var: MMTK_THREADS
  time_stats:
    type: Wrapper
    val: /usr/bin/time -f "%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k"
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: 5.4.1
  ocaml-5.4.1-flambda:
    configure_args:
    - --enable-flambda
    type: OCaml
    version: 5.4.1
  oxcaml-main:
    commit: 0c3b79a02b2c6404c889fd686657bf10347b6512
    dune_commit: e2fa6242753416f55f40aebc95d146688734c184
    type: OxCaml
schema_version: '1.0'
suites:
  macro-alt-ergo-monorepo:
    programs:
      alt_ergo_chain_default:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_default.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_chain_large:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_large.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_chain_small:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_small.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_fill:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill_x100.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_unsat_smt2:
        args: --steps-bound 12000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_yyll:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-coq-monorepo:
    ocamlrunparam: e=25,d=2
    programs:
      coqc_corelib_stress:
        args: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v
        build_script: coq.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq
      coqc_tree_default:
        args: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_default.v
        build_script: coq.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq
      coqc_tree_large:
        args: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_large.v
        build_script: coq.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq
      coqc_tree_small:
        args: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_small.v
        build_script: coq.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq
    timeout: 900
    type: OCamlBenchmarkSuite
  macro-cpdf-monorepo:
    programs:
      cpdf_blacktext:
        args: -blacktext ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig
          -o /dev/null
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
      cpdf_merge:
        args: -merge ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig
          ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o
          /dev/null
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
      cpdf_scale:
        args: scale-to-fit a4landscape -twoup ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig
          -o /dev/null
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
      cpdf_squeeze:
        args: -squeeze ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig
          -o /dev/null
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
      cpdf_squeeze_default:
        args: '24'
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
      cpdf_squeeze_large:
        args: '64'
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
      cpdf_squeeze_small:
        args: '8'
        build_script: cpdf.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-decompress:
    ocamlrunparam: e=25,d=2
    programs:
      test_decompress:
        args: 64 524288
        build_script: decompress.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress
      test_decompress_default:
        args: 1 268435456
        build_script: decompress.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress
      test_decompress_large:
        args: 1 1073741824
        build_script: decompress.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress
      test_decompress_small:
        args: 1 83886080
        build_script: decompress.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-devkit:
    programs:
      devkit_gzip:
        args: '5'
        build_script: ahrefs-devkit.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
      devkit_htmlstream:
        args: ''
        build_script: ahrefs-devkit.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
      devkit_htmlstream_default:
        args: '3'
        build_script: ahrefs-devkit.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
      devkit_htmlstream_large:
        args: '8'
        build_script: ahrefs-devkit.build.sh
        ocamlrunparam: e=25,d=2
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
      devkit_htmlstream_small:
        args: '1'
        build_script: ahrefs-devkit.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
      devkit_network:
        args: '4'
        build_script: ahrefs-devkit.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
      devkit_stre:
        args: '30'
        build_script: ahrefs-devkit.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit
    timeout: 600
    type: OCamlBenchmarkSuite
  macro-eio:
    ocamlrunparam: e=25,d=2
    programs:
      eio_conc_default:
        args: '9000'
        build_script: eio.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio
      eio_conc_large:
        args: '21000'
        build_script: eio.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio
      eio_conc_small:
        args: '3000'
        build_script: eio.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio
      eio_fiber_stream:
        args: ''
        build_script: eio.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-frama-c-monorepo:
    programs:
      frama_c_eva_sqlite:
        args: sqlite
        build_script: frama-c.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c
      frama_c_eva_sqlite_default:
        args: sqlite 2
        build_script: frama-c.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c
      frama_c_eva_sqlite_large:
        args: sqlite 3
        build_script: frama-c.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c
      frama_c_eva_sqlite_small:
        args: sqlite 0
        build_script: frama-c.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c
      frama_c_eva_t:
        args: t
        build_script: frama-c.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c
    timeout: 600
    type: OCamlBenchmarkSuite
  macro-goblint-monorepo:
    programs:
      goblint:
        args: ''
        build_script: goblint.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint
      goblint_gen_default:
        args: ''
        build_script: goblint.build.sh
        ocamlrunparam: e=25,d=2
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint
      goblint_gen_large:
        args: ''
        build_script: goblint.build.sh
        ocamlrunparam: e=25,d=2
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint
      goblint_gen_small:
        args: ''
        build_script: goblint.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-infer-monorepo:
    programs:
      infer_default:
        args: ''
        build_script: infer.build.sh
        ocamlrunparam: e=20,d=32
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer
      infer_large:
        args: ''
        build_script: infer.build.sh
        ocamlrunparam: e=20,d=32
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer
      infer_small:
        args: ''
        build_script: infer.build.sh
        ocamlrunparam: e=20,d=32
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer
    timeout: 600
    type: OCamlBenchmarkSuite
  macro-irmin:
    programs:
      irmin_mem_rw:
        args: 3000 10000 80 20000
        build_script: irmin.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin
      irmin_mem_rw_default:
        args: 10000 0 50 1000
        build_script: irmin.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin
      irmin_mem_rw_large:
        args: 18000 0 50 1000
        build_script: irmin.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin
      irmin_mem_rw_small:
        args: 6000 0 50 1000
        build_script: irmin.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-jsoo:
    programs:
      jsoo:
        args: ''
        build_script: jsoo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml
      jsoo_default:
        args: default
        build_script: jsoo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml
      jsoo_large:
        args: large
        build_script: jsoo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml
      jsoo_small:
        args: small
        build_script: jsoo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-lavyek-monorepo:
    programs:
      lavyek_kv_1d:
        args: 1 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_1d
        build_script: lavyek.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek
      lavyek_kv_2d:
        args: 2 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_2d
        build_script: lavyek.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek
      lavyek_kv_4d:
        args: 4 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_4d
        build_script: lavyek.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek
      lavyek_kv_8d:
        args: 8 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_8d
        build_script: lavyek.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek
    required_modifiers:
    - re_par
    - md_par
    - pin_lavyek
    timeout: 120
    type: OCamlBenchmarkSuite
  macro-liq-video-frames:
    programs:
      liq_video_frames_pool:
        args: '30000'
        build_script: liq-video-frames.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames
      liq_video_frames_pool_default:
        args: 15000 3840 2160
        build_script: liq-video-frames.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames
      liq_video_frames_pool_large:
        args: 15000 7680 4320
        build_script: liq-video-frames.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames
      liq_video_frames_pool_small:
