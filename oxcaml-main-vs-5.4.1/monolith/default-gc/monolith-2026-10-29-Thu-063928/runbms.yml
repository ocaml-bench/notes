      - merlin_bench
    description: "The ephemeron DATA field \u2014 Ephemeron.K1 with a value attached,\
      \ so\ncaml_ephe_set_data / get_data and the data branch of caml_ephe_clean.\n\
      This is the half of the machinery `weak_refs` does not reach: a weak\narray\
      \ is an ephemeron with no data field, so the weak benchmarks\nalready drive\
      \ allocation and the key scan, but only a K1-with-data\ntable drives the data\
      \ path. Rocq's CEphemeron is exactly that, and\nthe bytecode VM goes through\
      \ it for every global it patches into a\ncompiled term; `Compute` is `vm_compute`,\
      \ so every coq rung reaches\nit.\n"
