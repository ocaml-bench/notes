  bigarrays:
    description: "Bigarray allocation and access \u2014 caml_ba_alloc, caml_ba_get/set,\n\
      and caml_ba_finalize. A proper subset of `custom_blocks`, kept\nseparate because\
      \ Bigarray-specific regressions (the unboxed access\npath, the off-heap accounting\
      \ of ba data) hit a narrower code path.\n"
    exercised_by:
      macro-decompress:
      - test_decompress
      - test_decompress_small
      - test_decompress_default
      - test_decompress_large
      macro-liq-video-frames:
      - liq_video_frames_pool
      - liq_video_frames_pool_small
      - liq_video_frames_pool_default
      - liq_video_frames_pool_large
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      - ocamlc_compile_uucp
      - ocamlc_compile_uucp_small
      - ocamlc_compile_uucp_default
      - ocamlc_compile_uucp_large
      macro-owl:
      - owl_gc
      - owl_gc_small
      - owl_gc_default
      - owl_gc_large
      macro-pplacer:
      - pplacer_testsuite
      - pplacer_like_small
      - pplacer_like_default
      - pplacer_like_large
    verified_at:
    - "benchmarks/owl/owl_gc.ml:80 \u2014 100 Array2.create Float64 matrices of dim\
      \ x dim"
    - "benchmarks/liq-video-frames/liq_video_frames.ml:71-73 \u2014 three Array1 Char\
      \ planes per frame"
    - "duniverse/gsl-ocaml/src/vector.mli:10 \u2014 Gsl.Vector.vector IS a float64\
      \ Array1, and pplacer's kernel reads it with Caml_ba_data_val (vendor/pplacer/pplacer_src/linear_c.c:32)"
    - "compiler-libs bytecomp/emitcode.ml:52 \u2014 the bytecode emit buffer is a\
      \ Bigarray.Array1 of Char (5.5.0)"
    - "perf 5.5.0 test_decompress_small \u2014 caml_ba_get_N 4.6% of cycles (Bigstringaf\
      \ I/O buffers)"
  c_side_allocation:
    description: "C code that allocates in the OCaml heap and mutates it directly:\n\
      Alloc_small / caml_alloc_shr / caml_modify called from a foreign\nmutator, with\
      \ its own GC-entry and poll points. Rocq's bytecode VM\nis the big one \u2014\
      \ the reduction loop is a C interpreter building\nOCaml blocks \u2014 and camlpdf's\
      \ flate stubs do the same in miniature.\nDistinct from `ffi_bulk`, where the\
      \ C side only reads and writes\nmemory the OCaml side already owns.\n"
    exercised_by:
      macro-coq-monorepo:
      - coqc_corelib_stress
      - coqc_tree_small
      - coqc_tree_default
      - coqc_tree_large
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      - cpdf_squeeze_small
      - cpdf_squeeze_default
      - cpdf_squeeze_large
    verified_at:
    - "duniverse/rocq/kernel/byterun/rocq_interp.c:36,123,811,916 \u2014 its own Alloc_small\
      \ with an Enter_gc path, caml_alloc_shr for closures, caml_modify for accumulators"
    - "duniverse/rocq/kernel/byterun/rocq_interp.c:616 \u2014 Caml_check_gc_interrupt\
      \ poll inside the interpreter loop"
    - "perf 5.5.0 coqc_tree_small \u2014 caml_shared_try_alloc 16.8% + oldify_one\
      \ 17.5% + do_some_marking 9.9%, with rocq_interprete on the stack"
    - "vendor/camlpdf/flatestubs.c:58,68,113 \u2014 caml_alloc_small / caml_alloc\
      \ around the miniz stream"
  compare_hash:
    description: 'The runtime''s generic structural operations: compare_val /

      caml_compare / caml_equal / caml_string_compare and caml_hash

      (runtime/compare.c and runtime/hash.c).

      Reached through Stdlib Map, Set and Hashtbl on non-specialised key

      types, which is how most OCaml analysers key their state. This is

      pure runtime C, so a change to compare_val or to the hash mixer

      lands on exactly these benchmarks.

      '
    exercised_by:
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      - cpdf_squeeze_small
      - cpdf_squeeze_default
      - cpdf_squeeze_large
      macro-devkit:
      - devkit_network
      macro-frama-c-monorepo:
      - frama_c_eva_t
      - frama_c_eva_sqlite
      - frama_c_eva_sqlite_small
      - frama_c_eva_sqlite_default
      - frama_c_eva_sqlite_large
      macro-goblint-monorepo:
      - goblint
      - goblint_gen_small
      - goblint_gen_default
      - goblint_gen_large
      macro-menhir-monorepo:
      - menhir_ocamly
      - menhir_sql_parser
      - menhir_sysver
      - menhir_sysver_canonical
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      - ocamlc_compile_uucp
      - ocamlc_compile_uucp_small
      - ocamlc_compile_uucp_default
      - ocamlc_compile_uucp_large
      macro-ocamlformat:
      - ocamlformat_rocq
      - ocamlformat_rocq_small
      - ocamlformat_rocq_default
      - ocamlformat_rocq_large
    verified_at:
    - 'perf 5.5.0, share of cycles: cpdf_squeeze_small compare_val 17.2% + caml_hash
      3.8% + caml_compare 1.9%'
    - 'perf 5.5.0: frama_c_eva_sqlite_small caml_string_compare 7.8% + caml_hash 2.0%;
      menhir_sysver caml_hash 5.9% + compare_val 2.9%'
    - 'perf 5.5.0: goblint_gen_small compare_val 2.5% + caml_hash 1.4%; ocamlformat_rocq_small
      compare_val 3.7% + caml_hash 4.4% + caml_hash_mix_string 2.9%'
    - 'perf 5.5.0: devkit_network compare_val 3.6% + caml_hash 3.2%; ocamlc_self_compile
      caml_string_compare 2.5% + caml_hash 2.3%'
  custom_blocks:
    cold:
      macro-alt-ergo-monorepo:
      - alt_ergo_chain_small
      - alt_ergo_chain_default
      - alt_ergo_chain_large
      macro-frama-c-monorepo:
      - frama_c_eva_t
      - frama_c_eva_sqlite
      - frama_c_eva_sqlite_small
      - frama_c_eva_sqlite_default
      - frama_c_eva_sqlite_large
      macro-goblint-monorepo:
      - goblint
      - goblint_gen_small
      - goblint_gen_default
      - goblint_gen_large
    description: "caml_alloc_custom / caml_alloc_custom_mem blocks and the operations\n\
      in their custom_operations struct \u2014 including the `finalize` op, so\nthis\
      \ tag, not `ocaml_finalisers`, is where finalisation of owl's\nmatrices, zarith's\
      \ bignums, camlzip's streams and SQLite's handles\nlives. For a Bigarray that\
      \ op is the runtime's own caml_ba_finalize,\nwhich is what actually frees the\
      \ off-heap data; when it runs, and in\nwhat order, is measurable (see ocaml#14571\
      \ on owl). Bigarrays are the\ncommonest kind (see `bigarrays`, a proper subset);\
      \ the rest are GMP\nintegers, zlib streams, SQLite handles and the liq-video-frames\
      \ pool\nstub.\n"
    exercised_by:
      macro-decompress:
      - test_decompress
      - test_decompress_small
      - test_decompress_default
      - test_decompress_large
      macro-devkit:
      - devkit_gzip
